services:
  # Opt-in override: when this file is used, local Postgres is disabled by default.
  # Enable with `--profile localdb` only if you explicitly want the local db service.
  db:
    profiles:
      - localdb

  backend:
    environment:
      - DATABASE_URL=${SUPABASE_DATABASE_URL:?Set SUPABASE_DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NODE_ENV=${NODE_ENV:-production}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - STORAGE_DRIVER=supabase
      - SUPABASE_S3_ENDPOINT=${SUPABASE_S3_ENDPOINT:?Set SUPABASE_S3_ENDPOINT}
      - SUPABASE_S3_BUCKET=${SUPABASE_S3_BUCKET:?Set SUPABASE_S3_BUCKET}
      - SUPABASE_S3_ACCESS_KEY_ID=${SUPABASE_S3_ACCESS_KEY_ID:?Set SUPABASE_S3_ACCESS_KEY_ID}
      - SUPABASE_S3_SECRET_ACCESS_KEY=${SUPABASE_S3_SECRET_ACCESS_KEY:?Set SUPABASE_S3_SECRET_ACCESS_KEY}
      - SUPABASE_S3_REGION=${SUPABASE_S3_REGION:-auto}
      - SUPABASE_S3_FORCE_PATH_STYLE=${SUPABASE_S3_FORCE_PATH_STYLE:-true}
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED:-true}

  worker:
    environment:
      - DATABASE_URL=${SUPABASE_DATABASE_URL:?Set SUPABASE_DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NODE_ENV=${NODE_ENV:-production}
      - STORAGE_DRIVER=supabase
      - SUPABASE_S3_ENDPOINT=${SUPABASE_S3_ENDPOINT:?Set SUPABASE_S3_ENDPOINT}
      - SUPABASE_S3_BUCKET=${SUPABASE_S3_BUCKET:?Set SUPABASE_S3_BUCKET}
      - SUPABASE_S3_ACCESS_KEY_ID=${SUPABASE_S3_ACCESS_KEY_ID:?Set SUPABASE_S3_ACCESS_KEY_ID}
      - SUPABASE_S3_SECRET_ACCESS_KEY=${SUPABASE_S3_SECRET_ACCESS_KEY:?Set SUPABASE_S3_SECRET_ACCESS_KEY}
      - SUPABASE_S3_REGION=${SUPABASE_S3_REGION:-auto}
      - SUPABASE_S3_FORCE_PATH_STYLE=${SUPABASE_S3_FORCE_PATH_STYLE:-true}
