services:
  # Database with pgvector
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-TenderLens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-@TenderLens10111}
      POSTGRES_DB: ${POSTGRES_DB:-tenderlens}
    expose:
      - "5432"
    volumes:
      - tenderlens_pg:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-TenderLens} -d ${POSTGRES_DB:-tenderlens}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for BullMQ
  redis:
    image: redis:7
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:D0_7gm2nM5zQ1v9L1tRmYwPaUxB6cJqZde8fHY3kS@host.docker.internal:5433/postgres}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NODE_ENV=${NODE_ENV:-development}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-supabase}
      - SUPABASE_S3_ENDPOINT=${SUPABASE_S3_ENDPOINT:-http://host.docker.internal:8000/storage/v1/s3}
      - SUPABASE_S3_BUCKET=${SUPABASE_S3_BUCKET:-tenderlens}
      - SUPABASE_S3_ACCESS_KEY_ID=${SUPABASE_S3_ACCESS_KEY_ID:-625729a08b95bf1b7ff351a663f3a23c}
      - SUPABASE_S3_SECRET_ACCESS_KEY=${SUPABASE_S3_SECRET_ACCESS_KEY:-850181e4652dd023b7a98c58ae0d2d34bd487ee0cc3254aed6eda37307425907}
      - SUPABASE_S3_REGION=${SUPABASE_S3_REGION:-auto}
      - SUPABASE_S3_FORCE_PATH_STYLE=${SUPABASE_S3_FORCE_PATH_STYLE:-true}
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED:-true}
    expose:
      - "8080"
    volumes:
      - tenderlens_storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # Background Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["npm", "run", "worker:start"]
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:D0_7gm2nM5zQ1v9L1tRmYwPaUxB6cJqZde8fHY3kS@host.docker.internal:5433/postgres}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NODE_ENV=${NODE_ENV:-development}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-supabase}
      - SUPABASE_S3_ENDPOINT=${SUPABASE_S3_ENDPOINT:-http://host.docker.internal:8000/storage/v1/s3}
      - SUPABASE_S3_BUCKET=${SUPABASE_S3_BUCKET:-tenderlens}
      - SUPABASE_S3_ACCESS_KEY_ID=${SUPABASE_S3_ACCESS_KEY_ID:-625729a08b95bf1b7ff351a663f3a23c}
      - SUPABASE_S3_SECRET_ACCESS_KEY=${SUPABASE_S3_SECRET_ACCESS_KEY:-850181e4652dd023b7a98c58ae0d2d34bd487ee0cc3254aed6eda37307425907}
      - SUPABASE_S3_REGION=${SUPABASE_S3_REGION:-auto}
      - SUPABASE_S3_FORCE_PATH_STYLE=${SUPABASE_S3_FORCE_PATH_STYLE:-true}
    volumes:
      - tenderlens_storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # Frontend (Port 3005)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    expose:
      - "3005"
    depends_on:
      - backend
    restart: always

volumes:
  tenderlens_pg:
  tenderlens_storage:
