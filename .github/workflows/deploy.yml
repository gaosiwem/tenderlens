name: Deploy Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure app dir exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script_stop: true
          script: |
            set -euxo pipefail
            APP_DIR="${{ secrets.PROD_APP_DIR }}"
            if [ -z "${APP_DIR}" ]; then
              echo "PROD_APP_DIR is empty"
              exit 1
            fi
            mkdir -p "${APP_DIR}"

      - name: Upload project files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          source: "."
          target: "${{ secrets.PROD_APP_DIR }}"
          overwrite: true
          rm: false
          strip_components: 0
          tar_dereference: true
          tar_tmp_path: /tmp
          exclude: ".git,node_modules,**/node_modules,.env,backend/.env,frontend/.env.local,COOLIFY_ENV_PRODUCTION.txt,*.log,tmp,scratch"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script_stop: true
          script: |
            set -euxo pipefail

            APP_DIR="${{ secrets.PROD_APP_DIR }}"
            if [ -z "${APP_DIR}" ]; then
              echo "PROD_APP_DIR is empty"
              exit 1
            fi
            cd "${APP_DIR}"

            docker compose -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.prod.yml up -d --build

            docker compose -f docker-compose.prod.yml run --rm backend npx prisma migrate deploy

            docker compose -f docker-compose.prod.yml ps
